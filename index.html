<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You are invited | Aramide &amp; Busayo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7efe3;
    --wine:#6b1226;
    --crimson:#7a0f21;
    --gold:#c9a24a;
    --ink:#7a6451;
    --display:'Cormorant Garamond','Cormorant','Garamond',Georgia,serif;

    /* envelope size: max 460px, 92vw on mobile, never taller than the screen allows */
    --w:min(460px,92vw,calc((100vh - 130px) * .84));
    --h:calc(var(--w) / 1.32);
    --u:calc(var(--w) / 100);

    /* timeline */
    --t-seal:.5s;
    --t-flap:.95s;   --d-flap:.45s;
    --t-card:1.2s;   --d-card:1.35s;
    --t-leave:.7s;

    --tile-size:96px 96px;
    color-scheme:light;
    box-sizing:border-box;
  }
  @supports (height:100dvh){
    :root{--w:min(460px,92vw,calc((100dvh - 130px) * .84));}
  }
  @media (prefers-reduced-motion: reduce){
    :root{
      --t-seal:.01s; --t-flap:.01s; --d-flap:.05s;
      --t-card:.25s; --d-card:.1s; --t-leave:.3s;
    }
  }

  *,*::before,*::after{box-sizing:inherit;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;background:var(--cream);}
  body{font-family:var(--display);}

  /* ---------- Full screen ---------- */
  .screen{
    position:fixed;inset:0;
    display:grid;place-items:center;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
    background:radial-gradient(ellipse 70% 62% at 50% 46%, #fdf9f0 0%, #f9f2e6 38%, var(--cream) 70%, #eee1cc 100%);
    overflow:hidden;
  }
  .screen::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 85% 80% at 50% 48%, transparent 58%, rgba(112,74,38,.14) 100%);
  }
  .screen.is-leaving{
    opacity:0;
    transform:scale(1.08);
    transition:opacity var(--t-leave) ease, transform var(--t-leave) ease;
  }
  @media (prefers-reduced-motion: reduce){
    .screen.is-leaving{transform:none;}
  }

  .stage{
    position:relative;
    transition:transform var(--t-card) cubic-bezier(.22,.8,.24,1) var(--d-card);
  }
  .stage.is-opening{transform:translateY(calc(var(--h) * .2));}

  /* ---------- Envelope ---------- */
  .env{
    position:relative;
    width:var(--w);
    height:var(--h);
    perspective:calc(var(--w) * 2.6);
  }
  .env > *{position:absolute;}

  .env-shadow{
    inset:0;z-index:0;border-radius:2px;
    box-shadow:
      0 calc(var(--u) * 5) calc(var(--u) * 8) calc(var(--u) * -1) rgba(98,56,26,.40),
      0 calc(var(--u) * 1.2) calc(var(--u) * 2.4) rgba(98,56,26,.28),
      0 calc(var(--u) * 10) calc(var(--u) * 16) calc(var(--u) * -4) rgba(98,56,26,.18);
  }

  /* back panel: darker red */
  .back{
    inset:0;z-index:1;border-radius:2px;
    background:
      linear-gradient(180deg, rgba(0,0,0,.46), rgba(0,0,0,.24) 55%, rgba(0,0,0,.38)),
      var(--mottle),
      var(--tile),
      #4d0914;
    background-size:100% 100%, 256px 256px, var(--tile-size), auto;
  }

  /* textured surfaces share one pattern origin so it flows across flap and pocket */
  .tex{
    position:absolute;inset:0;
    background-color:#74101f;
    background-repeat:no-repeat, repeat, repeat, repeat;
    background-position:0 0, 0 0, 0 0, 0 0;
    background-size:100% 100%, 256px 256px, var(--tile-size);
  }

  /* pocket: left, right and bottom triangles meeting at the centre */
  .pocket{inset:0;z-index:4;}
  .tri{position:absolute;inset:0;}
  .tri.l{
    clip-path:polygon(0 0,50% 50%,0 100%);
    background-image:linear-gradient(90deg, rgba(255,205,195,.10), rgba(0,0,0,.20)), var(--mottle), var(--tile);
  }
  .tri.r{
    clip-path:polygon(100% 0,50% 50%,100% 100%);
    background-image:linear-gradient(270deg, rgba(255,205,195,.03), rgba(0,0,0,.30)), var(--mottle), var(--tile);
  }
  .tri.b{
    clip-path:polygon(0 100%,50% 50%,100% 100%);
    background-image:linear-gradient(0deg, rgba(0,0,0,.34), rgba(255,205,195,.06) 52%, rgba(0,0,0,.06)), var(--mottle), var(--tile);
  }
  .tri{
    background-color:#74101f;
    background-size:100% 100%, 256px 256px, var(--tile-size);
    background-repeat:no-repeat, repeat, repeat;
  }
  .folds{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;}
  .folds line{vector-effect:non-scaling-stroke;fill:none;}

  /* flap */
  .flap-shadow{
    left:0;top:0;width:100%;height:58%;z-index:5;
    clip-path:polygon(0 0,100% 0,50% 100%);
    background:rgba(24,0,6,.6);
    filter:blur(calc(var(--u) * 1.1));
    transform:translateY(calc(var(--u) * 1.7));
    transition:opacity .25s ease;
  }
  .flap{
    left:0;top:0;width:100%;height:58%;z-index:7;
    transform-origin:50% 0;
    transform-style:preserve-3d;
  }
  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
  }
  .face.front{clip-path:polygon(0 0,100% 0,50% 100%);}
  .face.front .tex{
    height:calc(var(--h));
    background-image:linear-gradient(180deg, rgba(255,210,200,.14), rgba(0,0,0,.04) 45%, rgba(0,0,0,.24) 100%), var(--mottle), var(--tile);
    background-size:100% calc(var(--h) * .58), 256px 256px, var(--tile-size);
  }
  .face.front svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
  .face.front svg line{vector-effect:non-scaling-stroke;}
  .face.back{
    transform:rotateX(180deg);
    clip-path:polygon(0 100%,100% 100%,50% 0);
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 7px),
      linear-gradient(0deg, #55091a, #330610);
  }
  .stage.is-opening .flap{animation:flap var(--t-flap) ease-in-out var(--d-flap) forwards;}
  .stage.is-opening .flap-shadow{opacity:0;}
  @keyframes flap{
    0%{transform:rotateX(0deg);z-index:7;}
    49.9%{z-index:7;}
    50%{z-index:2;}
    100%{transform:rotateX(180deg);z-index:2;}
  }

  /* ---------- Invitation card ---------- */
  .card{
    left:50%;top:8%;width:86%;height:84%;z-index:3;
    transform:translateX(-50%);
    background:
      radial-gradient(ellipse at 50% 0%, #fffdf6, rgba(255,253,246,0) 70%),
      linear-gradient(180deg, #fbf5e7, #f4ebd7);
    border-radius:2px;
    box-shadow:0 calc(var(--u) * .6) calc(var(--u) * 2.2) rgba(60,30,10,.28);
    text-align:center;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(var(--u) * 7.4) calc(var(--u) * 5) 0;
  }
  .card::before{
    content:"";position:absolute;inset:calc(var(--u) * 2.2);
    border:1px solid rgba(201,162,74,.55);
    pointer-events:none;
  }
  .stage.is-opening .card{
    transform:translate(-50%, calc(var(--h) * -.62));
    transition:transform var(--t-card) cubic-bezier(.22,.8,.24,1) var(--d-card);
  }
  .c-small{
    font-size:calc(var(--u) * 2.55);
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ink);
    font-weight:500;
    line-height:1.5;
  }
  .rule{
    position:relative;
    width:calc(var(--u) * 16);height:1px;
    margin:calc(var(--u) * 2.4) 0;
    background:linear-gradient(90deg, transparent, var(--gold) 28%, var(--gold) 72%, transparent);
  }
  .rule::after{
    content:"";position:absolute;left:50%;top:50%;
    width:calc(var(--u) * 1.5);height:calc(var(--u) * 1.5);
    background:var(--gold);
    transform:translate(-50%,-50%) rotate(45deg);
  }
  .c-names{
    font-size:calc(var(--u) * 8.4);
    font-weight:500;
    line-height:1.08;
    color:var(--wine);
    white-space:nowrap;
  }
  .c-names i{font-weight:400;color:var(--gold);padding:0 .08em;}
  .c-line{
    margin-top:calc(var(--u) * 1.6);
    font-size:calc(var(--u) * 3.5);
    font-style:italic;
    color:var(--ink);
    line-height:1.4;
  }
  .c-date{
    font-size:calc(var(--u) * 4.6);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--wine);
    font-weight:600;
  }

  /* ---------- Gold seal ---------- */
  .seal{
    left:50%;top:58%;
    width:calc(var(--w) * .21);height:calc(var(--w) * .21);
    margin:calc(var(--w) * -.105) 0 0 calc(var(--w) * -.105);
    z-index:10;
    border:0;padding:0;background:none;cursor:pointer;
    border-radius:50%;
    filter:drop-shadow(0 calc(var(--u) * .9) calc(var(--u) * 1.2) rgba(30,0,8,.55));
    -webkit-tap-highlight-color:transparent;
    transition:transform var(--t-seal) ease, opacity var(--t-seal) ease;
  }
  .seal svg{display:block;width:100%;height:100%;}
  .seal::after{
    content:"";position:absolute;inset:-6%;
    border:2px solid rgba(226,188,92,.85);
    border-radius:50%;
    animation:pulse 2.1s ease-out infinite;
    pointer-events:none;
  }
  .seal:focus-visible{
    outline:3px solid #fff7df;
    outline-offset:4px;
    box-shadow:0 0 0 7px rgba(107,18,38,.9);
  }
  .seal:disabled{cursor:default;}
  .seal:disabled::after{animation:none;opacity:0;}
  .stage.is-opening .seal{transform:scale(1.18);opacity:0;}
  @keyframes pulse{
    0%{transform:scale(.96);opacity:.9;}
    70%{transform:scale(1.34);opacity:0;}
    100%{transform:scale(1.34);opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .seal::after{animation:none;opacity:.6;}
  }

  .hint{
    left:50%;top:100%;
    transform:translateX(-50%);
    margin-top:calc(var(--u) * 6);
    white-space:nowrap;
    font-size:clamp(16px, calc(var(--u) * 4.4), 21px);
    font-style:italic;
    font-weight:500;
    color:var(--wine);
    transition:opacity .4s ease;
  }
  .stage.is-opening .hint{opacity:0;}
</style>
</head>
<body>

<main class="screen" id="screen">
  <div class="stage" id="stage">
    <div class="env">
      <div class="env-shadow"></div>
      <div class="back"></div>

      <div class="card">
        <div class="c-small">Together with their families</div>
        <div class="rule"></div>
        <h1 class="c-names">Aramide <i>&amp;</i> Busayo</h1>
        <div class="c-line">invite you to their wedding</div>
        <div class="rule"></div>
        <div class="c-date">5 January 2027</div>
      </div>

      <div class="pocket">
        <div class="tri l"></div>
        <div class="tri r"></div>
        <div class="tri b"></div>
        <svg class="folds" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <!-- crease shadow + highlight + fine gold edge along each fold -->
          <g stroke-linecap="butt">
            <line x1="0" y1="0" x2="50" y2="50" stroke="rgba(20,0,5,.55)" stroke-width="3"/>
            <line x1="100" y1="0" x2="50" y2="50" stroke="rgba(20,0,5,.6)" stroke-width="3"/>
            <line x1="0" y1="100" x2="50" y2="50" stroke="rgba(20,0,5,.6)" stroke-width="3"/>
            <line x1="100" y1="100" x2="50" y2="50" stroke="rgba(20,0,5,.6)" stroke-width="3"/>
            <line x1="0" y1="0" x2="50" y2="50" stroke="rgba(255,190,180,.5)" stroke-width="1" transform="translate(0.2,-0.35)"/>
            <line x1="0" y1="100" x2="50" y2="50" stroke="rgba(255,190,180,.4)" stroke-width="1" transform="translate(0.2,-0.35)"/>
            <line x1="0" y1="0" x2="50" y2="50" stroke="rgba(214,170,76,.7)" stroke-width="1" transform="translate(0.1,0.25)"/>
            <line x1="100" y1="0" x2="50" y2="50" stroke="rgba(214,170,76,.55)" stroke-width="1" transform="translate(-0.1,0.25)"/>
            <line x1="0" y1="100" x2="50" y2="50" stroke="rgba(214,170,76,.55)" stroke-width="1" transform="translate(0.1,-0.25)"/>
            <line x1="100" y1="100" x2="50" y2="50" stroke="rgba(214,170,76,.5)" stroke-width="1" transform="translate(-0.1,-0.25)"/>
          </g>
          <path d="M0.2,0 L0.2,99.8 L99.8,99.8 L99.8,0" fill="none" stroke="rgba(214,170,76,.45)" stroke-width="1" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>

      <div class="flap-shadow"></div>
      <div class="flap">
        <div class="face front">
          <div class="tex"></div>
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <line x1="0" y1="0" x2="50" y2="100" stroke="rgba(255,196,186,.55)" stroke-width="1.6"/>
            <line x1="100" y1="0" x2="50" y2="100" stroke="rgba(20,0,5,.6)" stroke-width="1.8"/>
            <line x1="0.4" y1="0" x2="50" y2="99" stroke="rgba(214,170,76,.75)" stroke-width="1" transform="translate(1.2,0)"/>
            <line x1="99.6" y1="0" x2="50" y2="99" stroke="rgba(214,170,76,.55)" stroke-width="1" transform="translate(-1.2,0)"/>
          </svg>
        </div>
        <div class="face back"></div>
      </div>

      <button class="seal" id="seal" type="button" aria-label="Open the wedding invitation">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fbe7a4"/>
              <stop offset=".45" stop-color="#c9983a"/>
              <stop offset="1" stop-color="#6e4710"/>
            </linearGradient>
            <radialGradient id="gold" cx=".36" cy=".3" r=".85">
              <stop offset="0" stop-color="#fff3bf"/>
              <stop offset=".3" stop-color="#ecc762"/>
              <stop offset=".68" stop-color="#c4912f"/>
              <stop offset="1" stop-color="#8a5c15"/>
            </radialGradient>
            <radialGradient id="inset" cx=".5" cy=".5" r=".5">
              <stop offset=".62" stop-color="rgba(70,35,0,0)"/>
              <stop offset="1" stop-color="rgba(70,35,0,.45)"/>
            </radialGradient>
            <radialGradient id="dome" cx=".3" cy=".22" r=".5">
              <stop offset="0" stop-color="rgba(255,255,255,.75)"/>
              <stop offset="1" stop-color="rgba(255,255,255,0)"/>
            </radialGradient>
            <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7a4f0e"/>
              <stop offset="1" stop-color="#4c2f06"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="48" fill="url(#rim)"/>
          <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,243,200,.55)" stroke-width=".8"/>
          <circle cx="50" cy="50" r="43.5" fill="url(#gold)"/>
          <circle cx="50" cy="50" r="43.5" fill="url(#inset)"/>
          <!-- engraved inner ring -->
          <circle cx="50.7" cy="50.7" r="34" fill="none" stroke="rgba(255,238,170,.85)" stroke-width="1.1"/>
          <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(100,64,10,.85)" stroke-width="1.1"/>
          <circle cx="50" cy="50" r="30.5" fill="none" stroke="rgba(100,64,10,.35)" stroke-width=".5" stroke-dasharray="1.2 2.2"/>
          <!-- intertwined A and B -->
          <g font-family="'Cormorant Garamond','Cormorant',Georgia,serif" font-style="italic" font-weight="600" font-size="43" text-anchor="middle">
            <text x="42.4" y="64.2" fill="rgba(255,240,180,.8)">A</text>
            <text x="41.6" y="63.4" fill="url(#ink)">A</text>
            <text x="59.4" y="64.2" fill="rgba(255,240,180,.8)">B</text>
            <text x="58.6" y="63.4" fill="url(#ink)" stroke="#e9c76a" stroke-width=".9" paint-order="stroke">B</text>
          </g>
          <ellipse cx="38" cy="27" rx="24" ry="15" fill="url(#dome)" transform="rotate(-24 38 27)"/>
        </svg>
      </button>

      <p class="hint" id="hint">Tap the gold seal to open</p>
    </div>
  </div>
</main>

<script>

<script>
  /* ---- Easy edits ---- */
  const SITE_URL    = "https://claude.ai/artifact/1V9cu8V1pGghJiejVAyJss"; // where the page goes after opening
  const TEXTURE_URL = "";  // optional: a flat, straight-on photo of the embossed red surface (use a data: URL; leave empty for the built-in texture)

  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const EXIT_AT = REDUCED ? 1500 : 3400;   // ms after the tap when the screen starts to zoom and fade
  const FADE_MS = REDUCED ? 300  : 700;    // keep in step with --t-leave

  /* ---------- Textures (lit, embossed leather; see the data script above) ---------- */
  const root = document.documentElement;
  root.style.setProperty("--mottle", `url("${BUILT_IN_MOTTLE}")`);
  if (TEXTURE_URL){
    root.style.setProperty("--tile", `url("${TEXTURE_URL}")`);
    root.style.setProperty("--tile-size", "var(--w) var(--h)");
  } else {
    root.style.setProperty("--tile", `url("${BUILT_IN_TILE}")`);
  }

  /* ---------- Interaction: only the seal opens it ---------- */
  const seal   = document.getElementById("seal");
  const stage  = document.getElementById("stage");
  const screen = document.getElementById("screen");

  function leave(){
    if (!SITE_URL) return;                       // nothing to go to: stay on the open invitation
    screen.classList.add("is-leaving");
    setTimeout(() => { window.location.href = SITE_URL; }, FADE_MS + 60);
  }

  seal.addEventListener("click", () => {
    seal.disabled = true;
    stage.classList.add("is-opening");
    setTimeout(leave, EXIT_AT);
  }, { once: true });
</script>
